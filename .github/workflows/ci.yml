name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate content data
        run: npm run velite:build
      - name: Mirror content assets
        run: npm run sync-assets
      - name: Validate asset mirror
        run: npm run check-assets
      - name: Validate i18n pairing
        run: npm run check-i18n-content && npm run check-i18n
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build + pagefind index
        run: npm run build
