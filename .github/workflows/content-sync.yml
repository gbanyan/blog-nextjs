name: Sync content submodule

# Keeps the `content` submodule pointer at the latest `main` of the
# `personal-blog` repository so new/edited posts deploy without a manual
# bump-and-push step. Pushes made here use GITHUB_TOKEN, which does not
# re-trigger this workflow, and are validated by the regular CI run.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Detect submodule drift
        id: drift
        run: |
          current="$(git ls-tree HEAD content | awk '{print $3}')"
          git -C content fetch --depth 1 origin main
          latest="$(git -C content rev-parse origin/main)"
          echo "current=$current"
          echo "latest=$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$latest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit pointer bump
        if: steps.drift.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content
          git commit -m "chore: sync content submodule to ${{ steps.drift.outputs.latest }}"
          git push origin main
